<!doctype html>
<html><head><meta charset="utf-8"><title>site - fixture</title></head>
<body>
<footer><a href="/cookies">Politique de cookies</a></footer>
<div class="cookie-banner" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:20px">
  <p>Nous utilisons des cookies.</p>
  <button onclick="window.__clicked='settings'">Personnaliser</button>
  <button onclick="window.__clicked='reject'; document.querySelector('.cookie-banner').remove()">Continuer sans accepter</button>
  <button onclick="window.__clicked='accept'; document.querySelector('.cookie-banner').remove()">Tout accepter</button>
</div>
</body></html>
