global.mode=DEVELOP
#Recorder
recorder.certificate.type=PKCS12
recorder.certificate.path=./cert/keystore.p12
recorder.certificate.alias=primemover
recorder.certificate.password=CHANGEME-password
#Export
export.FileTargetFolder=./out/har
export.Compression=ZIP
#Execution
runner.MaxParallelExecution=10
runner.UpdateInterval=2000
runner.MaxRedoMinutes=15
multilogin.StartupRetryCount=3
#Logging
logging.file.path="./log/"
logging.file.name="primemover-runner.log"
#logging.level.root=info

