# Spring profile "chrome-dev" -- boot the runner on a developer machine with no
# Multilogin account, no residential proxy and no S3 credentials, and drive bots
# through a plain local Chrome.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=chrome-dev
#   java -jar primemover-runner.jar --spring.profiles.active=chrome-dev
#
# Combine it with your own (gitignored) application-local.properties for the one
# secret that is still required -- backend.password, the local API login:
#
#   --spring.profiles.active=local,chrome-dev
#
# Everything not listed below is inherited from application.properties. Keep it
# that way: each line here is a thing a fresh checkout genuinely cannot do, not a
# preference.

# The blocker this profile exists for. MlxConfiguration signs in to Multilogin's
# cloud while building its beans, so with a blank multilogin.apiPassword Spring's
# context refresh failed and the JVM died at boot -- whatever browser the
# crawlers on the box used. false removes the beans entirely; a MULTILOGIN
# crawler then fails its own run with a clear message.
multilogin.enabled=false

# No X display, no VNC.
runner.chromeHeadless=true

# The MITM recorder builds its keystore from cert/2024/ca-cert.p12 and
# recorder.certificate.password, neither of which a fresh checkout has. Off means
# NoRecordingProxy, a pass-through: the bot still browses, only HAR capture is
# lost.
recorder.enabled=false

# No S3 key either, so job data has somewhere to land. out/ is gitignored.
storage.local.enabled=true
export.FileTargetFolder=out/chrome-dev

# Decisions go to the local decision server (see the orchestrator's lambda
# service), never to AWS. Same as the production default; stated so the profile
# is self-contained.
lambda.mode=local
