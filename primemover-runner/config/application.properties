#Stage
spring.application.name=primemover-runner
global.mode=PRODUCTION
#Recorder
recorder.certificate.type=PKCS12
recorder.certificate.path=cert/keystore.p12
recorder.certificate.alias=PrimemoverRunner
recorder.certificate.password=CHANGEME-password
recorder.gracefullTeardownSeconds=20
recorder.connectTimeoutSeconds=20
recorder.iddleConnectionTimeoutSeconds=60
recorder.requestTimeoutSeconds=300
recorder.connectivityRetryCount=3
recorder.connectivityDelaySeconds=5
recorder.verifyConnections=true
recorder.connectivityVerificationUrls=https://pm-api.test.primemover.example,https://app.multiloginapp.com/whatismyip
#Geosurf
geosurf.overwrite.user=multilogin-user@example.com
geosurf.overwrite.password=CHANGEME-password
#Anti-Captcha
anticaptcha.defaultMode=NEVER
anticaptcha.api.key=00000000000000000000000000000000
anticaptcha.api.solvingTimeoutSeconds=120
anticaptcha.check.enabled=true
anticaptcha.api.endpoint=https://api.anti-captcha.com
anticaptcha.api.blankPage=https://antcpt.com/blank.html
anticaptcha.extension.firefox=anticaptcha/anticaptcha-plugin_v0.60.xpi
anticaptcha.extension.chrome=anticaptcha/anticaptcha-plugin_v0.62.crx
#Export
export.FileTargetFolder=out/har
export.Compression=ZIP
#Execution
runner.MaxParallelExecution=2
runner.UpdateInterval=10
runner.MaxRedoMinutes=45
runner.StartupRetryCount=3
runner.ProcessingTimeoutMinutes=180
#Multilogin
multilogin.StartupRetryCount=3
multilogin.StartupDelaySeconds=20
multilogin.ConnectTimeoutSeconds=20
multilogin.ReadTimeoutSeconds=90
mulitlogin.ApiWaitSeconds=10
multilogin.DefaultProfileJsonPath=config/DefaultMultiLoginProfile.json
#API
backend.connectionTimeoutSeconds=10
backend.requestTimeoutSeconds=90
backend.endpoint=https://pm-api.test.primemover.example/api/v1/
backend.username=runner@primemover.example
backend.password=CHANGEME-backend-password
#Logging
logging.file.name=log/primemover-runner.log
logging.config=config/logback-spring.xml
#logging.level.org.springframework.web.client.RestTemplate=TRACE
#logging.level.org.littleshoot.proxy=INFO
#logging.level.primemover.converter.PrimemoverApiConverter=INFO
#logging.level.root=INFO
#logging.level.primemover=DEBUG
#logging.level.net.lightbody=ERROR
#logging.level.primemover.service.CrawlerService=TRACE
#outlets
outlets.refreshIntervalMinutes=60
#AwsS3
awsS3.accessKey=REMOVED-aws-access-key
awsS3.secretKey=REMOVED-aws-secret-key
awsS3.jobdata.bucketName=primemoverrunner
awsS3.jobdata.subFolder=reports/
awsS3.finalsource.bucketName=primemoverrunner
awsS3.finalsource.subFolder=finalsource/
