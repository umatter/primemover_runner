#Stage
spring.application.name=primemover-runner
global.mode=PRODUCTION
# Secrets live in an untracked config/secrets.properties (see secrets.properties.template).
# Its values override the blank placeholders below. optional: -> the runner still starts
# if the file is absent. Keep real credentials OUT of this tracked file.
spring.config.import=optional:file:./config/secrets.properties
#Consent
# What a bot does with a cookie / GDPR consent dialog (YouTube consent bump,
# OneTrust, Cookiebot, ...): accept | reject | ignore. This is the runner-wide
# default only; a crawler's cookie_pref preference ({"accept_all": true|false})
# overrides it, and a job's "consent" behaviour overrides both. Every outcome is
# logged per job ("consent dialog (youtube) answered: accept -> clicked 'Accept all'").
consent.choice=accept
#Recorder
recorder.enabled=true
recorder.certificate.type=PKCS12
recorder.certificate.path=cert/2024/ca-cert.p12
recorder.certificate.alias=primemoverrunner
recorder.certificate.password=
recorder.gracefullTeardownSeconds=20
recorder.connectTimeoutSeconds=20
recorder.iddleConnectionTimeoutSeconds=60
recorder.requestTimeoutSeconds=300
recorder.connectivityRetryCount=3
recorder.connectivityDelaySeconds=5
#HAR Recording - Job Type Filtering
# Enable/disable HAR recording globally
har.recording.enabled=true
# Comma-separated list of job types to exclude from HAR recording (no network activity expected)
har.recording.excludeJobTypes=WaitJob,ScrollByDurationJob,ScrollByLengthJob,HandleAlertJob,AssertTextInFieldJob,AssertElementExistsJob,AssertScrolledMaxJob,AssertPageLoadedJob,AssertProxyJob,AssertProxyByOxylabsJob
#HAR Recording - Content Filtering
# Enable/disable HAR content filtering (default: disabled to maintain current behavior)
har.filter.enabled=true
# Remove static resources (images, CSS, fonts, etc.) from HAR
har.filter.removeStaticResources=false
# Content types to filter out when removeStaticResources=true
har.filter.staticResourceTypes=image/png,image/jpeg,image/gif,image/webp,image/svg+xml,text/css,font/woff,font/woff2,font/ttf,application/font-woff,application/font-woff2,application/x-font-woff,application/x-font-ttf,application/javascript
# Comma-separated list of domains to INCLUDE in HAR (whitelist - all others excluded). Leave empty to include all.
har.filter.includeDomains=
# Comma-separated list of domains to EXCLUDE from HAR (blacklist - e.g., tracking/analytics)
har.filter.excludeDomains=criteo.com,imrworldwide.com,doubleclick.net,googlesyndication.com,google-analytics.com,googleadservices.com,facebook.net,scorecardresearch.com,adsrvr.org,adnxs.com,rubiconproject.com,pubmatic.com,casalemedia.com,openx.net,taboola.com,outbrain.com
# Maximum body size in bytes (bodies larger than this will be truncated). Leave empty to disable.
har.filter.maxBodySize=
# Comma-separated list of HTTP headers to remove from HAR entries
har.filter.removeHeaders=
#Proxy
proxy.pingConnections: false
proxy.verifyConnections: false
proxy.connectivityVerificationUrls=https://pm-api.test.primemover.example,https://app.multiloginapp.com/whatismyip
#Oxylabs
# Account used by every crawler whose proxy record leaves the credentials blank.
# Oxylabs geo-targeting comes from the crawler's AGENT, not from the proxy record,
# so without this every crawler in an experiment carries an identical copy of the
# same account - in the database and in the experiment spec. Set it once here and
# a spec needs only `proxy: {type: oxylabs}`. Credentials on a proxy record still
# win, so a one-off can override it.
#oxylabs.customer=<proxy-user>
#oxylabs.password=<secret>
#oxylabs.hostname=pr.oxylabs.io
#oxylabs.port=7777
# Session flavour. true (default) uses sessid_oneip, which pins the session to a
# single exit node and returns HTTP 502 when that node is lost. false uses plain
# sessid, which silently rebinds to a DIFFERENT exit IP after a peer drop or 60s
# without a request - so a job can change geography mid-run with no error. Keep
# true for experiment runs; a detectable 502 beats an undetected geography swap.
#oxylabs.session.oneip=true
# Both overrides replace the ENTIRE assembled username / password, not just the
# account name, so a user override must be a complete template including the
# customer- prefix, the location tokens and a literal %%SESSIONID%%.
#oxylabs.overwrite.user=
#oxylabs.overwrite.password=
#Anti-Captcha
anticaptcha.enabled=false
anticaptcha.defaultMode=NEVER
anticaptcha.api.key=
anticaptcha.api.solvingTimeoutSeconds=120
anticaptcha.check.enabled=true
anticaptcha.api.endpoint=https://api.anti-captcha.com
anticaptcha.api.blankPage=http://localhost:8080/anticaptcha/
anticaptcha.extension.firefox=anticaptcha/anticaptcha-plugin_v0.60.xpi
anticaptcha.extension.chrome=anticaptcha/anticaptcha-plugin_v0.67.crx
#Export
export.FileTargetFolder=out/har
export.Compression=ZIP
#Store job data only on S3 (no local copy). Set true to also write out/har (spool-and-drain buffer).
storage.local.enabled=false
#Execution
# Cap on concurrently executing queues == open browsers at once. This is a
# CEILING, not a target: the pool's queue is unbounded, so excess queues wait
# rather than fail, and nothing launches unless it is actually due.
#
# Was 2 from 2020 until 2026-08-24, sized for the old 8-core GPU-less Hetzner
# VM. Re-sized against measurements on ex63 (20 cores / 62 GB / Arrow Lake iGPU
# with VA-API decode). Staged ramp tests ran 4, 8, and 15 bots concurrently, a
# 1h single-bot soak, ~70 churn cycles, and a 20-bot test. Findings:
#
#   * RAM is NOT the constraint: real per-bot cost is ~0.85 GB (PSS / free -- an
#     earlier summed-RSS reading of ~1.8 GB over-counted shared pages ~5x). 19
#     concurrent bots used ~30 GB of 62; the box holds ~40-50 by memory alone.
#   * The first real ceiling is Multilogin's /profile/create rate limit: 50 API
#     ops/min. Launching 20 profiles in the SAME second overran it and one of 20
#     failed init with a 429; 15 simultaneous launches were clean (twice).
#
# So 20 is a safe RUNNING ceiling, but launching many at once is the hazard, not
# running them. In large experiments STAGGER start_at over 60-90s so profile
# creates stay under ~50/min; with staggering the box sustains 30-40. Raising
# this further is a rate-limit and exit-IP-supply question, not a hardware one.
runner.MaxParallelExecution=20

# Navigations one Chrome renderer may serve before it is bounced to reclaim
# leaked V8 heap. ChromeDriver leaks ~14 MB of old-space per same-site SPA
# navigation (Selenium #13510/#13533), so heap grows with queue length, not
# with time. Five 113-job YouTube queues on 2026-08-27 all died of
# "Reached heap limit" at 27-37 navigations; the same workflow at 8-13
# navigations per session ran 1828 jobs on 2026-08-24 with zero crashes.
# 25 leaves headroom under the 2048 MB cap set in ProfileService while
# bouncing rarely (~2 bounces per 55-navigation queue, ~2-3 s each).
# 0 disables recycling and restores the previous behaviour.
runner.RendererRecycleAfterNavigations=25

# Reload once when a watch page has no recommendation container.
#
# A YouTube SPA navigation can leave the shell in place -- ytd-watch-flexy and an
# empty #related -- while the data fetch that fills it never lands. The page is
# then permanently useless: no recommendations, no present video, nothing to
# decide from. Nothing in the workflow re-anchors, because the two visitjobs run
# only at the start, so every remaining lambdasingleselectjob grinds against the
# same dead page and the decision function correctly reports it cannot choose.
#
# Measured on experiment 147 (2026-08-28): soak3_us_04 clicked a recommendation
# at 23:01 and spent its remaining 49 decisions and 147 skipped jobs on the
# resulting shell -- 86 of 284 jobs, where the other ten bots finished 270-278.
# That single stuck page is 49 of the run's 60 job failures.
#
# The reload is bounded: one attempt, never a loop, and the session is marked
# degraded either way so a recovered run never reads as ordinary.
# false restores the previous behaviour (send the dead page to the decision
# function and let the job fail).
runner.RecoverUnrenderedWatchPage=true
#
# The reload above only helps a page that was transiently broken. It cannot help
# a page behaving correctly: an age-restricted video reloads straight back to
# "Sign in to confirm your age". Bot soak4_us_06 (experiment 148, 2026-08-31)
# clicked one and spent 13 failures in six minutes on it, because nothing in the
# workflow navigates again after the two opening visitjobs.
#
# So when the reload fails, the session returns to the last page that did carry
# recommendations. That breaks the chain -- the video that would have followed
# is never shown -- and the job is marked degraded accordingly, which is a much
# smaller loss than the remainder of the run.
runner.UpdateInterval=1
runner.MaxRedoMinutes=45
runner.StartupRetryCount=3
runner.ProcessingTimeoutMinutes=180
#Multilogin
multilogin.api.port=35000
multilogin.StartupRetryCount=3

# Delay between startup retries. Until 2026-08-29 there was none: the retry loop
# caught, logged and immediately went round again, which is worthless against
# the one failure that actually costs bots. The Multilogin workspace allows 50
# API operations per minute and POST /profile/create returns 429 once a launch
# burst crosses it; on experiment 147 one crawler's three rounds all ran inside
# eleven seconds (22:29:25, :30, :36), drew the same 429 each time, and the bot
# was lost with its 284 jobs.
#
# A rate limit is a clock, not a coin flip -- only time clears it -- so a 429
# waits out the window while everything else retries promptly.
# RateLimitBackoffSeconds must stay above 60 or the retry is spent inside the
# same window that rejected the previous attempt.
multilogin.StartupRetryDelaySeconds=5
multilogin.RateLimitBackoffSeconds=75
multilogin.StartupDelaySeconds=20
multilogin.ConnectTimeoutSeconds=20
multilogin.ReadTimeoutSeconds=90
mulitlogin.ApiWaitSeconds=10
multilogin.DefaultProfileJsonPath=config/DefaultMultiLoginProfile.json
multilogin.apiUser=multilogin-user@example.com
multilogin.apiPassword=
multilogin.defaultFolderId=2e8c5d68-bade-44dc-a45b-211c5435ebfd
#API
backend.connectionTimeoutSeconds=10
backend.requestTimeoutSeconds=90
backend.endpoint.api=http://localhost:8090/api/v1/
backend.endpoint.runner=http://localhost:8090/api/v1/runner/
backend.username=admin@primemover.example
backend.password=
#Logging
logging.file.name=log/primemover-runner.log
logging.config=config/logback-spring.xml
#logging.level.org.springframework.web.client.RestTemplate=TRACE
#logging.level.org.littleshoot.proxy=INFO
#logging.level.primemover.converter.PrimemoveryyApiConverter=INFO
#logging.level.root=INFO
#logging.level.primemover=DEBUG
#logging.level.net.lightbody=ERROR
#logging.level.primemover.service.CrawlerService=TRACE
#outlets
outlets.refreshIntervalMinutes=60
#AwsS3
# accessKey/secretKey are provided by config/secrets.properties (untracked).
# Leave these blank here — do not commit real credentials.
awsS3.accessKey=
awsS3.secretKey=
# Endpoint is host-specific (real AWS vs a self-hosted S3-compatible store), so it
# lives in config/secrets.properties alongside the credentials it belongs with.
# Blank here = real AWS in awsS3.region. See secrets.properties.template.
awsS3.endpoint=
awsS3.jobdata.bucketName=primemoverrunner
awsS3.jobdata.subFolder=reports/
awsS3.finalsource.bucketName=primemoverrunner
awsS3.finalsource.subFolder=finalsource/
#Lambda
# Lambda execution mode: "local" (default) or "aws". Any other value is an
# error at invoke time, not a silent fallback to AWS. Kept explicit here even
# though it matches the default, so the deployment states its intent.
lambda.mode=local
# Local Lambda server URL (used when lambda.mode=local)
lambda.local.url=http://localhost:5001/invoke
# Timeouts for the call to the local Lambda server. Until 2026-08-27 there were
# none: the client was a bare `new RestTemplate()`, so a Flask worker that wedged
# (hung socket, stalled OpenAI connection) held the calling thread forever. That
# thread is one of the runner.MaxParallelExecution browser threads, so a handful
# of wedged decisions starves the pool and the runner quietly stops picking up
# queues while still looking healthy.
#
# readTimeoutSeconds must comfortably exceed a slow-but-WORKING decision -- killing
# one of those costs more research data than the hang does. Arithmetic, from the
# decision function's own limits: openai_api_timeout_secs=60 AND
# openai_api_max_retries=1 means two attempts, so one call site can legitimately
# take 120s. The decision function abandons its remaining call sites once a failure
# is classified fatal, which bounds an invocation to roughly two call sites' worth
# of retries: 2 x 120s = 240s of OpenAI time, plus page parsing and response
# assembly over a full YouTube page (budget 60s) = ~300s worst legitimate case.
# 480s leaves ~60% headroom over that while still bounding a wedged Flask worker to
# 8 minutes rather than forever. (The 300s first set here came from an arithmetic
# that dropped the retry term; unbounded, four call sites x 120s = 480s, so it
# could have hard-failed a decision that was only slow.) connectTimeoutSeconds is
# small because the server is on loopback: connecting either works at once or is
# not going to. A value <= 0 falls back to these same defaults -- an unbounded wait
# is deliberately not configurable.
lambda.local.connectTimeoutSeconds=5
lambda.local.readTimeoutSeconds=480
#AwsLambda
# Only used when lambda.mode=aws.
awsLambda.apiCallTimeoutSeconds=180
awsLambda.apiCallAttemptTimeoutSeconds=120
