#Stage
spring.application.name=primemover-runner
global.mode=PRODUCTION
#Recorder
recorder.enabled=false
recorder.certificate.type=PKCS12
recorder.certificate.path=cert/2024/ca-cert.p12
recorder.certificate.alias=primemoverrunner
recorder.certificate.password=CHANGEME-password
recorder.gracefullTeardownSeconds=20
recorder.connectTimeoutSeconds=20
recorder.iddleConnectionTimeoutSeconds=60
recorder.requestTimeoutSeconds=300
recorder.connectivityRetryCount=3
recorder.connectivityDelaySeconds=5
#HAR Recording - Job Type Filtering
# Enable/disable HAR recording globally
har.recording.enabled=true
# Comma-separated list of job types to exclude from HAR recording (no network activity expected)
har.recording.excludeJobTypes=WaitJob,ScrollByDurationJob,ScrollByLengthJob,HandleAlertJob,AssertTextInFieldJob,AssertElementExistsJob,AssertScrolledMaxJob,AssertPageLoadedJob,AssertProxyJob,AssertProxyByGeosurfJob,AssertProxyByPrimemoverApiJob
#HAR Recording - Content Filtering
# Enable/disable HAR content filtering (default: disabled to maintain current behavior)
har.filter.enabled=true
# Remove static resources (images, CSS, fonts, etc.) from HAR
har.filter.removeStaticResources=false
# Content types to filter out when removeStaticResources=true
har.filter.staticResourceTypes=image/png,image/jpeg,image/gif,image/webp,image/svg+xml,text/css,font/woff,font/woff2,font/ttf,application/font-woff,application/font-woff2,application/x-font-woff,application/x-font-ttf,application/javascript
# Comma-separated list of domains to INCLUDE in HAR (whitelist - all others excluded). Leave empty to include all.
har.filter.includeDomains=
# Comma-separated list of domains to EXCLUDE from HAR (blacklist - e.g., tracking/analytics)
har.filter.excludeDomains=criteo.com,imrworldwide.com,doubleclick.net,googlesyndication.com,google-analytics.com,googleadservices.com,facebook.net,scorecardresearch.com,adsrvr.org,adnxs.com,rubiconproject.com,pubmatic.com,casalemedia.com,openx.net,taboola.com,outbrain.com
# Maximum body size in bytes (bodies larger than this will be truncated). Leave empty to disable.
har.filter.maxBodySize=
# Comma-separated list of HTTP headers to remove from HAR entries
har.filter.removeHeaders=
#Proxy
proxy.pingConnections: false
proxy.verifyConnections: false
proxy.connectivityVerificationUrls=https://pm-api.test.primemover.example,https://app.multiloginapp.com/whatismyip
#Geosurf
geosurf.overwrite.user=multilogin-user@example.com
geosurf.overwrite.password=CHANGEME-password
#Oxylabs
# Session flavour. true (default) uses sessid_oneip, which pins the session to a
# single exit node and returns HTTP 502 when that node is lost. false uses plain
# sessid, which silently rebinds to a DIFFERENT exit IP after a peer drop or 60s
# without a request - so a job can change geography mid-run with no error. Keep
# true for experiment runs; a detectable 502 beats an undetected geography swap.
#oxylabs.session.oneip=true
# Both overrides replace the ENTIRE assembled username / password, not just the
# account name, so a user override must be a complete template including the
# customer- prefix, the location tokens and a literal %%SESSIONID%%.
#oxylabs.overwrite.user=
#oxylabs.overwrite.password=
#Anti-Captcha
anticaptcha.enabled=false
anticaptcha.defaultMode=NEVER
anticaptcha.api.key=00000000000000000000000000000000
anticaptcha.api.solvingTimeoutSeconds=120
anticaptcha.check.enabled=true
anticaptcha.api.endpoint=https://api.anti-captcha.com
anticaptcha.api.blankPage=http://localhost:8080/anticaptcha/
anticaptcha.extension.firefox=anticaptcha/anticaptcha-plugin_v0.60.xpi
anticaptcha.extension.chrome=anticaptcha/anticaptcha-plugin_v0.67.crx
#Export
export.FileTargetFolder=out/har
export.Compression=ZIP
#Execution
runner.MaxParallelExecution=2
runner.UpdateInterval=10
runner.MaxRedoMinutes=45
runner.StartupRetryCount=3
runner.ProcessingTimeoutMinutes=180
#Multilogin
multilogin.api.port=35000
multilogin.StartupRetryCount=3
multilogin.StartupDelaySeconds=20
multilogin.ConnectTimeoutSeconds=20
multilogin.ReadTimeoutSeconds=90
mulitlogin.ApiWaitSeconds=10
multilogin.DefaultProfileJsonPath=config/DefaultMultiLoginProfile.json
multilogin.apiUser=multilogin-user@example.com
multilogin.apiPassword=CHANGEME-password
multilogin.defaultFolderId=2e8c5d68-bade-44dc-a45b-211c5435ebfd
#API
backend.connectionTimeoutSeconds=10
backend.requestTimeoutSeconds=90
backend.endpoint.api=https://pm-api.test.primemover.example/api/v1/
backend.endpoint.runner=https://pm-api.test.primemover.example/api/v1/runner/
backend.username=runner@primemover.example
backend.password=CHANGEME-backend-password
#Logging
logging.file.name=log/primemover-runner.log
logging.config=config/logback-spring.xml
#logging.level.org.springframework.web.client.RestTemplate=TRACE
#logging.level.org.littleshoot.proxy=INFO
#logging.level.primemover.converter.PrimemoveryyApiConverter=INFO
#logging.level.root=INFO
#logging.level.primemover=DEBUG
#logging.level.net.lightbody=ERROR
#logging.level.primemover.service.CrawlerService=TRACE
#outlets
outlets.refreshIntervalMinutes=60
#AwsS3
awsS3.accessKey=REMOVED-aws-access-key
awsS3.secretKey=REMOVED-aws-secret-key
awsS3.jobdata.bucketName=primemoverrunner
awsS3.jobdata.subFolder=reports/
awsS3.finalsource.bucketName=primemoverrunner
awsS3.finalsource.subFolder=finalsource/
#AwsLambda
awsLambda.apiCallTimeoutSeconds=180
awsLambda.apiCallAttemptTimeoutSeconds=120
