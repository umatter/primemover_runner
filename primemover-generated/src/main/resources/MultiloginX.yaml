  /v1/profile/f/{folder_id}/p/{profile_id}/start:
    get:
      tags:
      - Script Runner
      summary: Start Browser Profile with Selenium
      description: >-
        Start a browser profile with `automation_type=selenium`


        The endpoint will return a port for automation in the response message, that will be used to start Script Runner on active profiles.
      operationId: StartBrowserProfilewithSelenium
      parameters:
      - name: automation_type
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: selenium
      - name: folder_id
        in: path
        description: '`Required`. Specify the ID of the folder where the profile to launch is stored.'
        required: true
        style: simple
        schema:
          type: string
          example: uuid
      - name: profile_id
        in: path
        description: '`Required`. Specify the ID of the profile to launch.'
        required: true
        style: simple
        schema:
          type: string
          example: uuid
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProfileStarted1'
                - example:
                    status:
                      error_code: ''
                      http_code: 200
                      message: '54499'
              example:
                status:
                  error_code: ''
                  http_code: 200
                  message: '54499'
      deprecated: false
      servers:
      - url: https://launcher.mlx.yt:45001/api
        variables: {}
  /v1/run_script:
    post:
      tags:
      - Script Runner
      summary: Start Script Runner
      description: "Run scripts on one or multiple profiles. The endpoint allows executing scripts in two ways:\n\n1. **executing scripts on running/active profiles.**  \n    To use this method, start a profile with [GET Start Browser Profile](https://documenter.getpostman.com/view/28533318/2s946h9Cv9#292fe0f0-5b24-4dae-bcec-bf21b0d96367) with Seleinum and send a request to `POST Start Runner`, passing the profile IDs in the request body. Profiles remains open after the script has been executed.\n    \n2. **executing scripts along with starting profiles.**  \n    To use this method, send a request to `POST Start Runner`, passing the profile IDs in the request body. Profiles closes after the script has been executed.\n    \n\nThe value of `script_file` is the name of the .py file relative to the folder.\n\nScripts are stored by default in the following directories:\n\n- Windows: `C:\\Users\\%username%\\mlx\\deps\\scripts`\n    \n- macOS: `/Users/%username%/mlx/scripts`\n    \n- Linux: `/home/%username%/mlx/scripts`\n    \n\n**Required parameters:**\n\n``` json\n{\n    \"script_file\": \"<string>\",\n    \"profile_ids\": [\n        {\n            \"profile_id\": \"<string>\"\n        }\n    ]\n}\n\n ```"
      operationId: StartScriptRunner
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      requestBody:
        description: ''
        content:
          text/plain:
            schema:
              type: string
              example: >-
                {

                    "script_file": "<string>",

                    "profile_ids": [

                        {

                            "profile_id": "<string>",

                            "is_headless": <boolean>

                        }

                    ]

                }
            example: >-
              {

                  "script_file": "<string>",

                  "profile_ids": [

                      {

                          "profile_id": "<string>",

                          "is_headless": <boolean>

                      }

                  ]

              }
        required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ScriptRunnerStarted'
                - example:
                    data:
                    - profile_id: 8feb79fc-2b42-4d54-a3eb-f26fddd31499
                      status: success
                    - profile_id: 8feb79fc-2b42-4d54-a3eb-f26fddd31410
                      status: success
                    status:
                      error_code: ''
                      http_code: 200
                      message: ''
              example:
                data:
                - profile_id: 8feb79fc-2b42-4d54-a3eb-f26fddd31499
                  status: success
                - profile_id: 8feb79fc-2b42-4d54-a3eb-f26fddd31410
                  status: success
                status:
                  error_code: ''
                  http_code: 200
                  message: ''
      deprecated: false
      servers:
      - url: https://launcher.mlx.yt:45001/api
        variables: {}
