tags:
- name: Launcher
  description: For automation users, if you need the agent to be launched automatically every time you restart your device, here is [the article](https://help.multilogin.com/en_US/api/auto-launching-the-agent) from our support knowledge on how to make it happen.
- name: Profile Access Management
- name: Profile Management
- name: Browser Profile Data
- name: Proxy
- name: Pre-made Cookies
  description: "Multilogin X pre-made cookies serve to achieve the highest success rate possible for your browser profiles, eliminating the need of manual labour of collecting cookies and saving you much time when running browser automation or managing multiple profiles.\n\nMultilogin X pre-made cookies are grouped into 6 categories, based on your target website:\n\n- amazon\n    \n- bing\n    \n- ebay\n    \n- facebook\n    \n- google\n    \n- etsy\n    \n- mix\n    \n\nThese catergories will enable you to collect reliable cookies for creating a trustworthy browsing history for your profiles.\n\nFor more information on Multilogin X pre-made cookies, please visit [our knowledge base](https://help.multilogin.com/en_US/functionality/pre-made-cookies)."
- name: Script Runner
  description: "Multilogin X Script Runner is an easy-to-use solution for running automation scripts with minimal technical knowledge, that allows bulk operations on single or/and multiple profiles.\n\nScript Runner is available with Agent 1.37.4 onwards. Once Agent is updated, all the required folders and files will be downloaded from our server automatically.\n\nThe Script Runner binary is located in the following directories:\n\n- Windows: `C:\\Users\\%username%\\mlx\\deps\\script_runner`\n    \n- macOS: `/Users/%username%/mlx/deps/script_runner`\n    \n- Linux: `/home/%username%/mlx/deps/script_runner`\n    \n\nScripts are stored by default in the following directories:\n\n- Windows: `C:\\Users\\%username%\\mlx\\deps\\scripts`\n    \n- macOS: `/Users/%username%/mlx/deps/scripts`\n    \n- Linux: `/home/%username%/mlx/deps/scripts`\n    \n\nAs of December 2024, Agent will download example scripts automatically upon every launch. These scripts are stored on our servers and are for reference only.\n\nTo change the default directories for Script Runner and scripts, navigate to the following directories and change the values of `scriptrunnerpath` and `scriptsdirpath` in `launcher.yaml`:\n\n- Windows: `C:\\Users\\%username%\\mlx\\configs\\launcher.yaml`\n    \n- macOS: `/Users/%username%/mlx/configs/launcher.yaml`\n    \n- Linux: `/home/%username%/mlx/configs/launcher.yaml`"
- name: Profile Import/Export
  description: "A set of endpoints that allows exporting and importing profiles from the machine.\n\nProfiles are exported by default to the following directories:\n\n- Windows: `C:\\Users\\%username%\\mlx\\exports`\n    \n- macOS: `/Users/%username%/mlx/exports`\n    \n- Linux: `/home/%username%/mlx/exports`\n    \n\nTo change the default directory, navigate to the following directory and add `ExportDirectory`, specifying the desired directory  \nin `launcher.yaml`:\n\n- Windows: `C:\\Users\\%username%\\mlx\\configs\\launcher.yaml`\n    \n- macOS: `/Users/%username%/mlx/configs/launcher.yaml`\n    \n- Linux: `/home/%username%/mlx/configs/launcher.yaml`\n    \n\n```\nExportDirectory: \"/Users/username/mlx/new_dir_for_exports\"\n\n ```"
- name: Object Storage
  description: This feature enables file uploads and downloads from internal storage. It is available only on select plan tiers, depending on the plan’s permissions and entitlements.
- name: 2FA
  description: >-
    This feature allows the user to enable two-factor authentication (2FA) for their account, adding an extra layer of security.


    If 2FA is enabled at the workspace level, the user must also enable 2FA on their account to continue accessing the workspace successfully.
