openapi: 3.0.0
info:
  title: Multilogin X API
  description: "## **Multilogin X API Documentation**\n\nWelcome to the Multilogin X API documentation. This documentation serves to explain how to automate Multilogin X API endpoints by using scripts, bots and automation in general.\n\nOur API enables users and developers to programmatically manage browser profiles, perform actions such as creating, modifying, or deleting profiles, and retrieve data related to profile usage, activity etc.\n\n## **Authentication**\n\nMost of the API requests must be authenticated using Bearer Token. You can generate Bearer Token by signing in or refreshing it when needed.\n\nThe regular token has 30 minutes of lifetime. Upon expiration, you may refresh it with `POST /user/refresh_token` to obtain a new one.\n\nTo have higher rate limits and a longer token lifetime, it is recommended to get the [automation token](https://documenter.getpostman.com/view/28533318/2s946h9Cv9#918a9c42-cb0f-497f-9bdd-a44d9d760be5).\n\n## **Endpoints Overview**\n\nThe Multilogin X API provides endpoints for various actions divided into the following categories:\n\n- **Base URL**: api.multilogin.com\n    \n- **Launcher:** Start, stop, get basic infomation about browser profiles.\n    \n- **Launcher V2:** To be depricated soon.\n    \n- **Launcher V3:** Provides the latest versions of endpoints to start browser profiles.\n    \n- **Profile Management:** Create, update, delete, browser profiles.\n    \n- **Profile Access Management**: Sign in, manage your password and token, get basic information on workspaces.\n    \n- **Browser Profile Data:** Unlock browser profiles.\n    \n\n## **Request and Response Format**\n\nThe API accepts JSON-formatted requests and returns responses in JSON format.\n\n## **Error Handling**\n\nThe API follows standard HTTP status codes to indicate the success or failure of requests. Error responses include error messages to assist in troubleshooting.\n\nErrors are categorized into the following groups:\n\n1. **Client Errors (4xx):** These errors occur when there is an issue with the client's request, such as invalid parameters or unauthorized access.\n    \n    - **400 Bad Request:** The request was invalid or malformed. Check the request parameters and try again. This type typically relates to wrong or invalid data being sent.\n        \n    - **401 Unauthorized:** Authentication credentials are missing or invalid. Ensure you are using valid credentials and tokens.\n        \n    - **403 Forbidden:** The user does not have permission to access the requested resource.\n        \n    - **429 Too Many Request:** The error indicates that the user has sent too many requests in a given amount of time exceeding the rate limit.\n        \n2. **Server Errors (5xx):** These errors occur when there is an issue on the server side, such as internal server errors or service unavailable.\n    \n    - **500 Internal Server Error:** An unexpected error occurred on the server side. This may happen when the server cannot process your request due to multiple technical reasons. Wrong payloads or inconsistent data sent can also raise this error. Contact support if the issue persists.\n        \n\nFor more information on using the Multilogin X API, please refer to the API documentation with code examples or navigate to our [support page](https://help.multilogin.com/en_US/multilogin-x).\n\nHave feedback to share? Take a minute to fiil in this quick [survey](https://tally.so/r/nWABkk)."
  contact: {}
  version: '1.0'
servers:
- url: https://launcher.mlx.yt:45001/api
  variables: {}
- url: https://api.multilogin.com
  variables: {}
- url: https://profile-proxy.multilogin.com/v1
  variables: {}
- url: https://cookies.multilogin.com/api/v1/cookies
  variables: {}
paths:
  /v2/profile/f/{folder_id}/p/{profile_id}/start:
    get:
      tags:
      - Launcher
      summary: Start Browser Profile
      description: >-
        This endpoint supports both Strict and Non-Strict modes. In Strict mode, all required parameters must be explicitly specified. In contrast, Non-Strict mode allows for faster usage by applying default values to any unspecified parameters. Default values will be visible for each parameter.


        Start a browser profile.


        The endpoint will return a port for automation in the response message if the automation type parameter is passed. See `automation_type` in the "Query Params" section.


        **NB: Mimic profiles will work with** **`custom_start_urls`** **only if** **`automation_type`** **is NOT specified. This is to be fixed soon.****Stealthfox profiles work as expected.**


        **Required parameters for Strict mode:**


        ``` json

        "folder_id":"<string>",

        "profile_id":"<string>",

        "automation_type":"<value>",

        "headless_mode":<boolean>

         ```
      operationId: StartBrowserProfile
      parameters:
      - name: automation_type
        in: query
        description: '`Optional`. Specify the automation type. Mimic can work with any of the types. Stealthfox can only work with **selenium**. Defaults to `selenium`.'
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: selenium, puppeteer, playwright
      - name: headless_mode
        in: query
        description: '`Optional`. Enable headless mode for all browsers. Defaults to `false`.'
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: false, true
      - name: folder_id
        in: path
        description: '`Required`. Specify the ID of the folder where the profile to launch is stored. Defaults to `default folder`.'
        required: true
        style: simple
        schema:
          type: string
          example: uuid
      - name: profile_id
        in: path
        description: '`Required`. Specify the ID of the profile to launch.'
        required: true
        style: simple
        schema:
          type: string
          example: uuid
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: X-Strict-Mode
        in: header
        description: Default to false. If set to true, you must specify values for all required parameters.
        required: true
        style: simple
        schema:
          type: string
          example: boolean
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProfileStarted'
                - example:
                    data:
                      browser_type: mimic
                      core_version: 132
                      id: 81b5627a-1212-4016-9467-3dbe4d6f78eb
                      is_quick: false
                      port: '55513'
                    status:
                      error_code: ''
                      http_code: 200
                      message: Profile started successfully
              example:
                data:
                  browser_type: mimic
                  core_version: 132
                  id: 81b5627a-1212-4016-9467-3dbe4d6f78eb
                  is_quick: false
                  port: '55513'
                status:
                  error_code: ''
                  http_code: 200
                  message: Profile started successfully
      deprecated: false
      servers:
      - url: https://launcher.mlx.yt:45001/api
        variables: {}
  /v3/profile/quick:
    post:
      tags:
      - Launcher
      summary: Start Quick Profile v3
      description: "This endpoint supports both Strict and Non-Strict modes. In Strict mode, all required parameters must be explicitly specified. In contrast, Non-Strict mode allows for faster usage by applying default values to any unspecified parameters. Default values will be visible for each parameter.\n\nCreate a one-time quick browser profile, that opens up after the call is successfully made. Browsing activity and its related data is not saved after the profle has been stopped.\n\nFingerprint parameters need providing only if flags set to `Custom`.\n\nCheck out **Params** to see what each key-value pair is about. To copy the example request body, navigate to **Body**.\n\nNote that the custom URL feature will be available for Mimic quick browsers **ONLY** if the `automation` value is not provided in the request. Stealthfox browsers works as expected.\n\nIf you would like to avoid having your profiles updated to the latest available core, specify `auto_update_core` (`true` or `false`) and a specific `core_version`.  \nUpdating existing profiles to a specific core version is not supported.\n\n**Mimic quick profiles will work with** **`custom_start_urls`** **only if** **`automation_type`** **is NOT specified. This is to be fixed soon. Stealthfox profiles work as expected.**\n\n**NB: It is recommended to use the default values, which keep your browser cores up-to-date. Multilogin does not bear any responsability for ban or detection-related issues if profiles have a dated core version.**\n\n**Required parameters for Strict mode:**\n\nStart Quick Profile v3 has `proxy` inside `parameters`.\n\n``` json\n{\n    \"browser_type\": \"<string>\",\n    \"os_type\": \"<string>\",\n    \"automation\": \"<string>\",\n    \"auto_update_core\": <boolean>,\n    \"core_version\": <number>,\n    \"is_headless\": <boolean>,\n    \"parameters\": {\n        \"flags\": {\n            \"audio_masking\": \"value\",\n            \"fonts_masking\": \"value\",\n            \"geolocation_masking\": \"value\",\n            \"geolocation_popup\": \"value\",\n            \"graphics_masking\": \"value\",\n            \"graphics_noise\": \"value\",\n            \"localization_masking\": \"value\",\n            \"media_devices_masking\": \"value\",\n            \"navigator_masking\": \"value\",\n            \"ports_masking\": \"value\",\n            \"proxy_masking\": \"value\",\n            \"screen_masking\": \"value\",\n            \"timezone_masking\": \"value\",\n            \"webrtc_masking\": \"value\",\n            \"canvas_noise\" :\"value\",\n            \"startup_behavior\" :\"value\"\n        }\n        \"fingerprint\": {}\n}\n\n ```\n\nThe number of parameters in `fingerprint` may vary depending on the flag values passed in the request body.\n\nTo use quick profiles with [Script Runner](https://go.postman.co/workspace/My-Workspace~ccd73442-99e9-4b09-8bed-73dcedfe74b9/documentation/28533318-54a9773a-031e-4904-b607-e372445dc2ba?entity=folder-ae883a9a-6cc8-4de6-bdab-0ce3b05e83a6), use the following additional parameters:\n\n``` json\n\"automation\": \"selenium\",\n\"script_file\": \"your_file.py\"\n\n ```"
      operationId: StartQuickProfilev3
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      - name: X-Strict-Mode
        in: header
        description: Default to false. If set to true, you must specify values for all required parameters.
        required: true
        style: simple
        schema:
          type: string
          example: boolean
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: string
              example: >-
                {

                    "browser_type": "<string>",

                    "os_type": "<string>",

                    "script_file": "<string>",

                    "automation": "<string>",

                    "core_version": <integer>,

                    "is_headless": <boolean>,

